<div class="case-study-detail container" *ngIf="caseStudy">
  <div class="hero">
    <h1 class="content-title">{{caseStudy.title}}</h1>

    <p *ngIf="caseStudy?.excerpt" class="excerpt">
      {{caseStudy.excerpt}}
    </p>

    <div class="meta-pills" *ngIf="caseStudy?.role || caseStudy?.timeline">
      <p *ngIf="caseStudy?.role" class="role">
        <span class="meta-label">Role:</span> {{caseStudy.role}}
      </p>
      <p *ngIf="caseStudy?.timeline" class="role">
        <span class="meta-label">Timeline:</span> {{caseStudy.timeline}}
      </p>
    </div>

    <img *ngIf="caseStudy.heroImage" [src]="caseStudy.heroImage" [alt]="caseStudy.title" class="hero-image"/>

    <ul class="tags">
      <li *ngFor="let tag of caseStudy.tags">
        {{tag}}
      </li>
    </ul>
  </div>

  <div class="overview" *ngIf="caseStudy.overview">
    <div class="overview-item" *ngIf="caseStudy.overview.role">
      <strong>Role:</strong> {{caseStudy.overview.role}}
    </div>
    <div class="overview-item" *ngIf="caseStudy.overview.timeline">
      <strong>Timeline:</strong> {{caseStudy.overview.timeline}}
    </div>
    <div class="overview-item" *ngIf="caseStudy.overview.techStack?.length">
      <strong>Tech Stack:</strong>
      <ul>
        <li *ngFor="let tech of caseStudy.overview.techStack">{{tech}}</li>
      </ul>
    </div>
    <div class="overview-item" *ngIf="caseStudy.overview.liveUrl">
      <strong>Live URL:</strong> <a [href]="caseStudy.overview.liveUrl" target="_blank">View Live</a>
    </div>
  </div>

  <div class="body-content" [innerHTML]="portableTextHtml"></div>

  <nav class="prev-next-nav" *ngIf="prevStudy || nextStudy">
    <a *ngIf="prevStudy" [routerLink]="['/case-studies', prevStudy.slug.current]" class="nav-link prev">
      <span class="nav-label">← Previous</span>
      <span class="nav-title">{{ prevStudy.title }}</span>
    </a>
    <a *ngIf="nextStudy" [routerLink]="['/case-studies', nextStudy.slug.current]" class="nav-link next">
      <span class="nav-label">Next →</span>
      <span class="nav-title">{{ nextStudy.title }}</span>
    </a>
  </nav>

  <links
    [contact]="true"
    [projects]="false"
    [about]="true"
    [caseStudies]="true"
    [seeDigitalSolutions]="true"
  ></links>
</div>
