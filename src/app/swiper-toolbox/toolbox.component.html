<div class="toolbox-container">
  <swiper [config]="config">
    <ng-template swiperSlide *ngFor="let tool of toolbox">
      <a href="{{ tool.url }}" target="_blank" rel="noopener noreferrer" >
        <img src="{{ tool.image }}" alt="{{ tool.title }} Icon" title="{{ tool.title }}">
      </a>
    </ng-template>
  </swiper>
</div>
