<div class="container" *ngIf="work">
  <!-- Thumbnail Hero Scroll to Content -->
  <ng-container *ngIf="work.thumbnail || work.thumbnail_src">
    <div class="thumb-container" (click)="scrollToContent()">
      <picture>
        <img
          class="thumbnail"
          title="{{ work.title }}"
          src="{{ work.thumbnail_src.url }}"
          alt="{{ work.thumbnail_src.alt ? work.thumbnail_src.alt : work.title + ' thumbnail image' }}" >
      </picture>

      <h1 class="project-title">{{ work.title }}</h1>

      <p>(Scroll)</p>

              transform="translate(50.000000, 51.409000) scale(1, -1) rotate(-270.000000) translate(-50.000000, -51.409000) ">
        </path>
      </svg>
    </div>
  </ng-container>

  <!-- Image Gallery -->
  <ng-container *ngIf="work.image_src && work.image_src.length > 0">
    <div class="images-section">
      <h2 *ngIf="work.image_src.length > 1">Gallery</h2>
      <h2 *ngIf="work.image_src.length === 1">Media</h2>

      <div class="gallery-intrinsic__container">
        <ul #galleryContainer class="images-container">
          <li #galleryImage class="image" *ngFor="let image of work.image_src">
            <img
              title="{{ image.caption ? image.caption : null }}"
              src="{{ image.url }}"
              alt="{{ image.alt ? image.alt : work.title + ' gallery image' }}"
            >
          </li>
        </ul>
      </div>
    </div>
  </ng-container>

  <!-- Video -->
  <ng-container *ngIf="work.video_src && work.video_src.length > 0">
    <div class="videos-section">
      <video *ngFor="let video of work.video_src" autoplay loop playsinline muted class="video-js">
        <p class="vjs-no-js">
          To view this video please enable JavaScript, and consider upgrading to a
          web browser that
          <a href="https://videojs.com/html5-video-support/" target="_blank"
          >supports HTML5 video</a
          >
        </p>
        <source src="{{ video.url }}">
        <track label="English" kind="captions" srclang="en" src="" default>
      </video>
    </div>
  </ng-container>

  <div class="links-section">
    <links [contact]="true" [projects]="true" [about]="true"></links>
  </div>
</div>

<div *ngIf="this.projectNotFound" class="not-found_container">
  <not-found></not-found>
</div>
